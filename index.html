<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page-head-start -->
<title>Bull Run Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=Outfit:wght@400;600;800&family=UnifrakturCook:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
<!-- page-head-end -->
</head>
<body>
<!-- page-body-start -->
<main id="app" class="stage-1">
  <header id="status">
    <div id="status-top" hidden>
      <strong id="money">£0.00</strong>
      <div id="worth" hidden>
        <span id="worth-text"></span>
        <svg id="spark" viewBox="0 0 80 24" aria-hidden="true"><path fill="none" stroke="#49D17D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span id="cut-chip">👨‍🌾 <b id="cut">90%</b></span>
    </div>
    <div id="activity">
      <span id="activity-text">🌿 Grazing</span>
      <span id="activity-side"></span>
      <div class="bar"><span id="activity-fill"></span></div>
    </div>
  </header>
  <section id="scene" aria-label="The field. Tap to work.">
    <div id="sun" aria-hidden="true"></div>
    <svg class="backdrop" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10 96 C70 56 150 58 226 80 C290 60 350 62 420 86 V300 H-10Z" fill="#9FD265"/>
      <g stroke="#7FB84C" stroke-width="2" vector-effect="non-scaling-stroke">
        <path id="plot-chicken-land" class="land" d="M150 92 L270 74 L276 138 L150 150Z"/>
        <path id="plot-sheep-land" class="land" d="M270 74 L410 84 L410 146 L276 138Z"/>
        <path id="plot-goat-land" class="land" d="M150 150 L276 138 L282 205 L150 214Z"/>
        <path id="plot-tractor-land" class="land" d="M276 138 L410 146 L410 212 L282 205Z"/>
      </g>
    </svg>
    <div id="farmhouse" aria-hidden="true">🏠</div>
    <div id="ground"></div>
    <div id="tufts" aria-hidden="true"></div>
    <div id="plots"></div>
    <svg id="plough" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M0 22 H42" stroke="#3A2A1C" stroke-width="5" fill="none"/>
      <path d="M38 12 L100 12 L112 4" stroke="#B9783F" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M58 14 L50 56 L84 62 L74 14Z" fill="#AEB8C2"/>
    </svg>
    <img id="bull" src="assets/bull-side.png" alt="The bull" draggable="false">
    <button id="clover" type="button" hidden aria-label="Pick the lucky clover">🍀</button>
    <button id="paper" type="button" hidden aria-label="Pick up the newspaper">📰</button>
    <div id="barn" hidden>
      <div id="lantern" aria-hidden="true">🏮</div>
      <div id="hay" aria-hidden="true"></div>
      <img id="barn-bull" src="assets/bull-read.png" alt="The bull, in the barn" draggable="false">
      <button id="door" type="button" hidden aria-label="Open the back door"><span></span></button>
      <svg id="bear" hidden data-mood="neutral" viewBox="0 0 170 190" role="img" aria-label="Grizz, a blue bear in a flat cap">
        <path d="M14 192 C18 150 46 134 85 134 C124 134 152 150 156 192Z" fill="#C49A5A"/>
        <path d="M66 136 L85 170 L104 136Z" fill="#F4F1EA"/>
        <circle cx="34" cy="40" r="17" fill="#6F83A3"/>
        <circle cx="136" cy="40" r="17" fill="#6F83A3"/>
        <rect x="24" y="26" width="122" height="122" rx="56" fill="#8498B8"/>
        <ellipse cx="85" cy="118" rx="36" ry="26" fill="#DDE4EE"/>
        <path d="M74 103 H96 L85 115Z" fill="#232840"/>
        <g class="eyes">
          <circle cx="60" cy="80" r="16" fill="#fff"/><circle cx="110" cy="80" r="16" fill="#fff"/>
          <circle class="pupil" cx="60" cy="81" r="7" fill="#232840"/><circle class="pupil" cx="110" cy="81" r="7" fill="#232840"/>
          <rect class="lid" x="42" y="62" width="86" height="36" fill="#8498B8"/>
        </g>
        <g fill="none" stroke="#232840" stroke-width="6" stroke-linecap="round">
          <path class="mood neutral smug lean" d="M46 62 L74 66 M96 66 L124 62"/>
          <path class="mood gloat" d="M44 56 L74 70 M96 70 L126 56"/>
          <path class="mood shock" d="M46 54 Q60 44 74 54 M96 54 Q110 44 124 54"/>
          <path class="mood neutral" d="M72 128 Q88 134 102 124"/>
          <path class="mood smug" d="M68 124 Q88 140 106 122"/>
        </g>
        <ellipse class="mood lean" cx="85" cy="130" rx="6" ry="4" fill="#232840"/>
        <path class="mood gloat" d="M62 122 Q85 128 108 122 Q104 144 85 144 Q66 144 62 122Z" fill="#232840"/>
        <rect class="mood gloat" x="90" y="124" width="10" height="9" fill="#FFC83D"/>
        <ellipse class="mood shock" cx="85" cy="133" rx="10" ry="12" fill="#232840"/>
        <path d="M22 44 C28 12 62 4 90 6 C118 8 146 20 148 44 C110 32 60 32 22 44Z" fill="#3F4F42"/>
        <path d="M12 48 C44 30 76 32 108 42 C80 52 40 56 12 48Z" fill="#2E3A30"/>
      </svg>
    </div>
    <div id="talk" role="status" aria-live="polite" hidden>
      <img id="talk-face" src="assets/face-neutral.png" alt="">
      <p id="talk-text"></p>
    </div>
    <p id="hint">Tap the field to graze</p>
    <div id="floats" aria-hidden="true"></div>
  </section>
  <button id="cta" type="button" hidden><b id="cta-title"></b><small id="cta-note"></small></button>
  <section id="panel" aria-label="Game menu" hidden>
    <div id="panel-inner">
      <div id="rows"></div>
      <footer id="foot" hidden>
        <span>Fictional money. Not investment advice.</span>
        <button id="reset" type="button">Start over</button>
      </footer>
    </div>
  </section>
  <nav id="tabs" aria-label="Game sections" hidden>
    <button id="tab-farm" type="button" class="on">🌾<span>Farm</span></button>
    <button id="tab-barn" type="button" hidden>🏚️<span>Barn</span></button>
    <button id="tab-markets" type="button" hidden>📈<span>Markets</span></button>
    <button id="tab-stats" type="button">📊<span>Stats</span></button>
  </nav>
  <div id="reader" hidden>
    <article id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-headline">
      <h2 id="masthead">The Daily Bull Run</h2>
      <p id="sheet-issue"></p>
      <h3 id="sheet-headline"></h3>
      <p id="sheet-body"></p>
      <p id="sheet-bonus"></p>
      <button id="sheet-close" type="button">Back to the field</button>
    </article>
  </div>
</main>
<script src="engine.js"></script>
<script src="charts.js"></script>
<script src="game.js"></script>
<!-- page-body-end -->
</body>
</html>
