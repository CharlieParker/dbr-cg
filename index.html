<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page-head-start -->
<title>Bull Run Escape</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Old+Standard+TT:wght@400;700&family=Patrick+Hand&family=UnifrakturCook:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
<!-- page-head-end -->
</head>
<body>
<!-- page-body-start -->
<main id="app" class="stage-1">
  <section id="scene" aria-label="The field. Tap to work.">
    <div id="sun" aria-hidden="true"></div>
    <svg class="backdrop" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10 92 C70 42 150 48 226 78 C290 52 350 54 420 84 V300 H-10Z" fill="#A7D65C" stroke="#1B0F08" stroke-width="4" vector-effect="non-scaling-stroke"/>
      <g stroke="#1B0F08" stroke-width="4" stroke-linejoin="round" vector-effect="non-scaling-stroke">
        <path id="plot-chicken-land" class="land" d="M-10 96 L104 66 L128 148 L-10 182Z"/>
        <path id="plot-sheep-land" class="land" d="M104 66 L232 76 L252 158 L128 148Z"/>
        <path id="plot-goat-land" class="land" d="M-10 182 L128 148 L142 216 L-10 232Z"/>
        <path id="plot-tractor-land" class="land" d="M128 148 L252 158 L262 226 L142 216Z"/>
      </g>
    </svg>
    <svg id="farmhouse" viewBox="0 0 120 110" aria-hidden="true">
      <g stroke="#1B0F08" stroke-width="5" stroke-linejoin="round">
        <path d="M10 106 V48 L60 8 L110 48 V106Z" fill="#D4321C"/>
        <path d="M38 106 V64 H82 V106Z" fill="#F7F3E8"/>
        <path d="M38 64 L82 106 M82 64 L38 106" fill="none"/>
      </g>
    </svg>
    <div id="ground"></div>
    <div id="tufts" aria-hidden="true"></div>
    <div id="helpers" aria-hidden="true"></div>
    <div id="plots"></div>
    <svg id="plough" viewBox="0 0 120 70" aria-hidden="true">
      <path d="M0 22 H42" stroke="#1B0F08" stroke-width="5" fill="none"/>
      <path d="M38 12 L100 12 L112 4" stroke="#1B0F08" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M38 12 L100 12 L112 4" stroke="#B9783F" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M58 14 L50 56 L84 62 L74 14Z" fill="#9AA6AE" stroke="#1B0F08" stroke-width="4" stroke-linejoin="round"/>
    </svg>
    <img id="bull" src="assets/bull-side.png" alt="The bull" draggable="false">
    <div id="quota" hidden>
      <div class="bar"><span id="quota-fill"></span></div>
      <span id="quota-label"></span>
    </div>
    <button id="clover" type="button" hidden aria-label="Pick the lucky clover">
      <svg viewBox="0 0 60 60" aria-hidden="true"><g fill="#FFC72C" stroke="#1B0F08" stroke-width="4"><circle cx="30" cy="16" r="12"/><circle cx="16" cy="30" r="12"/><circle cx="44" cy="30" r="12"/><circle cx="30" cy="42" r="12"/></g><circle cx="30" cy="29" r="5" fill="#FFF3B0"/></svg>
    </button>
    <button id="paper" type="button" hidden aria-label="Pick up the newspaper">
      <svg viewBox="0 0 80 60" aria-hidden="true"><path d="M6 8 L70 3 L74 50 L10 56Z" fill="#F7F3E8" stroke="#1B0F08" stroke-width="4" stroke-linejoin="round"/><path d="M16 15 L62 12 M18 26 L38 25 M18 34 L38 33 M19 42 L39 41 M46 24 L64 23 L65 42 L47 43Z" stroke="#1B0F08" stroke-width="3" fill="none"/></svg>
    </button>
    <div id="barn" hidden>
      <div id="lantern" aria-hidden="true"></div>
      <div id="hay" aria-hidden="true"></div>
      <img id="barn-bull" src="assets/bull-read.png" alt="The bull, in the barn" draggable="false">
      <button id="door" type="button" hidden aria-label="Open the back door"><span></span></button>
      <svg id="bear" hidden viewBox="0 0 170 230" role="img" aria-label="Grizz, a bear in a flat cap and dark glasses">
        <g stroke="#1B0F08" stroke-width="5" stroke-linejoin="round">
          <path d="M12 228 C14 170 44 142 85 142 C126 142 156 170 158 228Z" fill="#A9834E"/>
          <path d="M60 146 L85 196 L110 146Z" fill="#F7F3E8"/>
          <path d="M79 158 L91 158 L96 198 L85 212 L74 198Z" fill="#D4321C"/>
          <path d="M40 158 L66 142 L85 196 L66 214Z" fill="#8C6A3A"/>
          <path d="M130 158 L104 142 L85 196 L104 214Z" fill="#8C6A3A"/>
          <circle cx="36" cy="42" r="16" fill="#66778E"/>
          <circle cx="134" cy="42" r="16" fill="#66778E"/>
          <path d="M28 84 C28 42 52 26 85 26 C118 26 142 42 142 84 C142 128 118 152 85 152 C52 152 28 128 28 84Z" fill="#7D8FA8"/>
          <path d="M52 112 C52 94 68 88 85 88 C102 88 118 94 118 112 C118 132 102 142 85 142 C68 142 52 132 52 112Z" fill="#D8DEE6"/>
          <path d="M72 96 H98 L85 110Z" fill="#1B0F08"/>
          <path d="M66 124 C78 132 96 132 110 120" fill="none"/>
          <path d="M92 127 H104 V136 H92Z" fill="#FFC72C" stroke-width="3"/>
          <path d="M34 62 H78 C80 84 74 92 56 92 C40 92 34 80 34 62Z" fill="#1B0F08"/>
          <path d="M92 62 H136 C136 80 130 92 114 92 C96 92 90 84 92 62Z" fill="#1B0F08"/>
          <path d="M76 66 H94" fill="none"/>
          <path d="M26 46 C30 14 64 4 92 6 C120 8 146 22 146 46 C110 34 60 34 26 46Z" fill="#3D4A36"/>
          <path d="M18 50 C50 32 80 34 112 44 C84 54 44 58 18 50Z" fill="#2C3627"/>
        </g>
        <path d="M44 68 L58 68 L50 84" fill="none" stroke="#F7F3E8" stroke-width="4"/>
      </svg>
    </div>
    <header id="hud">
      <div id="belly-wrap">
        <span id="belly-label">Belly</span>
        <div id="belly" role="progressbar" aria-label="Belly" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="belly-fill"></span></div>
      </div>
      <div id="purse" hidden>
        <strong id="money">£0.00</strong>
        <span id="rate" hidden></span>
        <div id="freedom" hidden>
          <span id="freedom-label"></span>
          <div class="bar"><span id="freedom-fill"></span></div>
        </div>
      </div>
      <div id="cut-sign" hidden>
        <span>The Man's cut</span>
        <strong id="cut">90%</strong>
      </div>
    </header>
    <div id="talk" role="status" aria-live="polite" hidden>
      <img id="talk-face" src="assets/face-neutral.png" alt="">
      <p id="talk-text"></p>
    </div>
    <p id="hint">Tap the field to graze</p>
    <div id="floats" aria-hidden="true"></div>
  </section>
  <section id="panel" aria-label="Farm menu" hidden>
    <nav id="tabs" aria-label="Menu">
      <button id="tab-main" type="button" class="on">Shop</button>
      <button id="tab-stats" type="button">Stats</button>
    </nav>
    <div id="panel-inner">
      <div id="rows"></div>
      <footer id="foot">
        <span>Fictional money. Not investment advice.</span>
        <button id="reset" type="button">Start over</button>
      </footer>
    </div>
  </section>
  <div id="reader" hidden>
    <article id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-headline">
      <h2 id="masthead">The Daily Bull Run</h2>
      <p id="sheet-issue"></p>
      <h3 id="sheet-headline"></h3>
      <p id="sheet-body"></p>
      <p id="sheet-bonus"></p>
      <button id="sheet-close" type="button">Back to the field</button>
    </article>
  </div>
</main>
<script src="engine.js"></script>
<script src="game.js"></script>
<!-- page-body-end -->
</body>
</html>
